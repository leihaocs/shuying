name: shuying
description: 书影温故 · 记录每一本书的阅读轨迹与每一部电影的观影轨迹
publish_to: 'none'
version: 1.0.0+1

environment:
  # 下限放宽到 2.19 以兼容鸿蒙 Flutter（3.7.12-ohos 分支，Dart 2.19）；
  # 官方 Flutter 3.x 与鸿蒙分支共用本约束。
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 读取 App 版本号（设置页「关于」用，避免版本号写死两处不同步）。
  # 鸿蒙端若 pub get 报错，参考 README「鸿蒙适配」一节添加 dependency_overrides。

  # 状态管理（纯 Dart，三端通用）
  provider: ^6.1.2

  # 本地持久化。
  # 鸿蒙端需要对应的 shared_preferences ohos 实现，直接声明依赖以自动注册。
  # shared_preferences 锁到 2.2.2：2.2.2 兼容 Dart 2.19（OHOS 分支），
  # 而 2.2.3+ 需要 Dart 3.1+，主 Flutter（Dart 3.13）也兼容 2.2.2 API。
  shared_preferences: 2.2.2
  shared_preferences_ohos:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 约束放宽到 2.x 以兼容鸿蒙 Flutter 分支（Dart 2.19）
  flutter_lints: '>=2.0.0 <5.0.0'

# 鸿蒙适配：Flutter 3.13+ 起官方 shared_preferences 已原生支持 ohos 平台，
# 直接使用 pub.dev 版本即可，无需本地 fork overrides。

dependency_overrides:
  # 鸿蒙 fork 的 shared_preferences_android 2.2.0 仍引用已移除的 v1 embedding Registrar，
  # 在 Flutter 3.13+ 上 compileRelease 会失败；我们已移除 registerWith 方法，
  # 并用本地 path override 让 Android 使用 patched 版本。
  shared_preferences_android:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_android
  # shared_preferences_platform_interface 锁到 2.3.1：2.3.1 兼容 Dart 2.19，
  # shared_preferences_ohos 2.2.0 需要 ^2.3.0；2.3.2+ 需要 Dart 3+。
  shared_preferences_platform_interface: 2.3.1
  # 其余各平台实现统一走鸿蒙 fork 的 2.3.x（约束 platform_interface ^2.3.0），
  # 避免 pub.dev 上的 2.4.x 要求 platform_interface ^2.4 与上面 2.3.1 冲突。
  shared_preferences_foundation:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_foundation
  shared_preferences_linux:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_linux
  shared_preferences_windows:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_windows
  shared_preferences_web:
    path: /Users/leihao/flutter_packages_ohos/packages/shared_preferences/shared_preferences_web
  # win32 锁到 4.1.4：
  #   - 主 Flutter (Dart 3.13) 默认会拉到 5.x，但 5.x 用 Dart 3.0 `base class`
  #     与 ffi ^2.1.3，与 OHOS 分支 (Dart 2.19) 不兼容；
  #   - 4.1.4 默认因 UnmodifiableUint8ListView 在 Dart 3.13 后被移除而失败；
  #   - 我们已手动 patch pub-cache 中的 4.1.4：在 lib/src/guid.dart 加
  #     `typedef UnmodifiableUint8ListView = Uint8List;`，同时给三端共用。
  win32: 4.1.4

flutter:
  uses-material-design: true
